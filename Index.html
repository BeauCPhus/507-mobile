<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>507 Movements Mobile</title>
<style>
:root{
  --bg:#111;
  --panel:#1b1b1b;
  --panel2:#242424;
  --text:#f4f4f4;
  --muted:#aaa;
  --line:#333;
  --accent:#f0c24b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{
  position:sticky;top:0;z-index:5;
  padding:calc(10px + env(safe-area-inset-top)) 14px 12px;
  background:rgba(17,17,17,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)
}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:21px;margin:0;letter-spacing:.02em}
.small{font-size:12px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 120px;gap:10px;margin-top:10px}
input,button{
  min-height:48px;border:1px solid #444;border-radius:12px;
  background:var(--panel2);color:var(--text);font-size:17px;padding:0 14px
}
button{font-weight:700}
button:active{transform:scale(.98)}
main{padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{
  border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);
  min-height:220px;display:flex;flex-direction:column;cursor:pointer
}
.card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:white;display:block}
.card .num{font-size:28px;font-weight:800;padding:10px 12px 2px}
.card .hint{font-size:13px;color:var(--muted);padding:0 12px 12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}

.viewer{
  display:none;position:fixed;inset:0;z-index:20;background:var(--bg);
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)
}
.viewer.show{display:flex;flex-direction:column}
.viewerbar{
  min-height:58px;display:grid;grid-template-columns:58px 1fr 58px;
  align-items:center;border-bottom:1px solid var(--line);padding:0 6px
}
.viewerbar button{min-height:44px;padding:0;font-size:24px;border:0;background:transparent}
.viewertitle{text-align:center;font-size:22px;font-weight:800}
.stage{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 12px 8px;overflow:auto
}
.stage img{
  width:min(92vw,620px);max-height:68vh;object-fit:contain;background:white;border-radius:12px
}
.caption{width:min(92vw,620px);font-size:16px;line-height:1.35;color:#ddd;margin:10px auto 0}
.caption a{color:var(--accent)}
.nav{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 12px;border-top:1px solid var(--line)
}
.nav button{min-height:58px;font-size:18px}
.badge{
  display:inline-block;border:1px solid #555;border-radius:999px;padding:5px 9px;font-size:12px;color:#ccc
}
.empty{padding:30px 10px;text-align:center;color:var(--muted);display:none}
</style>
</head>
<body>
<header>
  <div class="topline">
    <div>
      <h1>507 Movements</h1>
      <div class="small">mobile prototype · movements 1–20</div>
    </div>
    <span class="badge">V1</span>
  </div>
  <div class="controls">
    <input id="search" inputmode="numeric" placeholder="Jump to movement #">
    <button id="go">GO</button>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">No movement in this prototype matches that number.</div>
</main>

<section id="viewer" class="viewer" aria-hidden="true">
  <div class="viewerbar">
    <button id="close" aria-label="Close">×</button>
    <div id="viewerTitle" class="viewertitle">Movement 1</div>
    <button id="source" aria-label="Open source">↗</button>
  </div>
  <div id="stage" class="stage">
    <img id="bigImg" alt="">
    <div class="caption">
      Large-format mobile view. Tap ↗ for the original 507movements.com page.
      Swipe left/right or use the buttons below.
    </div>
  </div>
  <div class="nav">
    <button id="prev">‹ PREV</button>
    <button id="next">NEXT ›</button>
  </div>
</section>

<script>
const MAX = 20;
const grid = document.getElementById('grid');
const viewer = document.getElementById('viewer');
const bigImg = document.getElementById('bigImg');
const viewerTitle = document.getElementById('viewerTitle');
const search = document.getElementById('search');
const empty = document.getElementById('empty');
let current = 1;

const pad = n => String(n).padStart(3,'0');
const imgUrl = n => `https://507movements.com/img/mm_${pad(n)}.png`;
const pageUrl = n => `https://507movements.com/mm_${pad(n)}.html`;

function makeCard(n){
  const c = document.createElement('article');
  c.className='card';
  c.dataset.n=n;
  c.innerHTML = `
    <img loading="lazy" src="${imgUrl(n)}" alt="Movement ${n}">
    <div class="num">${n}</div>
    <div class="hint">tap for full screen</div>`;
  c.addEventListener('click',()=>openMovement(n));
  return c;
}
for(let i=1;i<=MAX;i++) grid.appendChild(makeCard(i));

function openMovement(n){
  if(n<1 || n>MAX) return;
  current=n;
  viewerTitle.textContent=`Movement ${n}`;
  bigImg.src=imgUrl(n);
  bigImg.alt=`Movement ${n}`;
  viewer.classList.add('show');
  viewer.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  history.replaceState(null,'',`#${n}`);
}
function closeViewer(){
  viewer.classList.remove('show');
  viewer.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  history.replaceState(null,'',location.pathname);
}
function jump(delta){
  const n=current+delta;
  if(n>=1 && n<=MAX) openMovement(n);
}
document.getElementById('close').onclick=closeViewer;
document.getElementById('prev').onclick=()=>jump(-1);
document.getElementById('next').onclick=()=>jump(1);
document.getElementById('source').onclick=()=>window.open(pageUrl(current),'_blank');

function go(){
  const n=parseInt(search.value.trim(),10);
  if(Number.isInteger(n) && n>=1 && n<=MAX){
    empty.style.display='none';
    openMovement(n);
  } else {
    empty.style.display='block';
  }
}
document.getElementById('go').onclick=go;
search.addEventListener('keydown',e=>{if(e.key==='Enter')go()});

let x0=null;
viewer.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
viewer.addEventListener('touchend',e=>{
  if(x0===null) return;
  const dx=e.changedTouches[0].clientX-x0;
  if(Math.abs(dx)>60) jump(dx<0?1:-1);
  x0=null;
},{passive:true});

const hashNum=parseInt(location.hash.slice(1),10);
if(hashNum>=1 && hashNum<=MAX) openMovement(hashNum);
</script>
</body>
</html>
